name: Release RepoOps

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic Versioning version, without the leading v (for example 0.3.0)
        required: true
        type: string
      prerelease:
        description: Publish as a prerelease and do not move the stable major channel
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release target
        uses: actions/checkout@v4
        with:
          ref: MASTER
          fetch-depth: 0
          fetch-tags: true

      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Version must be a valid Semantic Versioning value such as 0.3.0."
            exit 1
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail

          TAG="v${VERSION}"

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; continuing with stable channel update."
          elif [[ "${PRERELEASE}" == "true" ]]; then
            gh release create "${TAG}" \
              --target MASTER \
              --title "RepoOps ${TAG}" \
              --generate-notes \
              --prerelease
          else
            gh release create "${TAG}" \
              --target MASTER \
              --title "RepoOps ${TAG}" \
              --generate-notes
          fi

      - name: Move stable major channel
        if: inputs.prerelease == false
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          TAG="v${VERSION}"
          MAJOR="v${VERSION%%.*}"
          REPOSITORY="${GITHUB_REPOSITORY}"

          TARGET_SHA="$(gh api \
            "repos/${REPOSITORY}/git/ref/tags/${TAG}" \
            --jq '.object.sha')"

          TARGET_TYPE="$(gh api \
            "repos/${REPOSITORY}/git/ref/tags/${TAG}" \
            --jq '.object.type')"

          # GitHub releases may create an annotated tag object. Resolve it to
          # the underlying commit so the moving major channel points directly
          # at the released source commit.
          if [[ "${TARGET_TYPE}" == "tag" ]]; then
            TARGET_SHA="$(gh api \
              "repos/${REPOSITORY}/git/tags/${TARGET_SHA}" \
              --jq '.object.sha')"
          fi

          if gh api \
            "repos/${REPOSITORY}/git/ref/tags/${MAJOR}" \
            >/dev/null 2>&1; then
            gh api \
              --method PATCH \
              "repos/${REPOSITORY}/git/refs/tags/${MAJOR}" \
              -f sha="${TARGET_SHA}" \
              -F force=true
          else
            gh api \
              --method POST \
              "repos/${REPOSITORY}/git/refs" \
              -f ref="refs/tags/${MAJOR}" \
              -f sha="${TARGET_SHA}"
          fi

          VERIFIED_SHA="$(gh api \
            "repos/${REPOSITORY}/git/ref/tags/${MAJOR}" \
            --jq '.object.sha')"

          if [[ "${VERIFIED_SHA}" != "${TARGET_SHA}" ]]; then
            echo "::error::Stable channel ${MAJOR} did not resolve to the released commit."
            exit 1
          fi

          echo "Stable channel ${MAJOR} now points to ${TAG} (${TARGET_SHA})."
