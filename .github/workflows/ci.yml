name: CI

on:
  pull_request:
  push:
    branches: [MASTER]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: repoops
          POSTGRES_PASSWORD: repoops-test-password
          POSTGRES_DB: repoops_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U repoops -d repoops_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      REPOOPS_TEST_DATABASE_URL: postgresql://repoops:repoops-test-password@127.0.0.1:5432/repoops_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Run checks
        run: npm run check
