name: RepoOps IssueOps

on:
  issue_comment:
    types: [created]
  issues:
    types: [closed]

permissions:
  contents: read
  issues: write

jobs:
  handle:
    if: ${{ github.event.issue.pull_request == null && (github.event_name == 'issues' || (github.event_name == 'issue_comment' && github.event.comment.user.type == 'User')) }}
    concurrency:
      group: repoops-mutations-${{ github.repository }}
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run RepoOps handler
        run: node src/index.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
