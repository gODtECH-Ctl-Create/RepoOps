name: RepoOps Claim

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: repoops-claim-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  claim:
    if: ${{ github.event.issue.pull_request == null && startsWith(github.event.comment.body, '/claim') }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run RepoOps claim handler
        run: node src/index.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
