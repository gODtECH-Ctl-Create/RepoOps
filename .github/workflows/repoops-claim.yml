name: RepoOps IssueOps

on:
  issue_comment:
    types: [created]
  issues:
    types: [closed]

permissions:
  contents: read
  issues: write

concurrency:
  group: repoops-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  handle:
    if: ${{ github.event.issue.pull_request == null && (github.event_name == 'issues' || startsWith(github.event.comment.body, '/')) }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run RepoOps handler
        run: node src/index.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
