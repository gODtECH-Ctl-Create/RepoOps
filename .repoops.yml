# RepoOps repository policy
commands:
  claim: true
  unclaim: true
labels:
  inProgress: "status: in-progress"

assignments:
  reminderAfterDays: 3
  expireAfterDays: 7
  autoRelease: false

contributorLimits:
  maxActiveAssignments: 2
  limitMaintainers: false

contributorGuidance:
  enabled: true
  requirements: "Node.js 20+ and Git"
  setupCommand: "npm install"
  checkCommand: "npm run check"
  contributingUrl: "https://github.com/gODtECH-Ctl-Create/RepoOps/blob/MASTER/CONTRIBUTING.md"
  developmentUrl: "https://github.com/gODtECH-Ctl-Create/RepoOps/blob/MASTER/docs/development.md"
  architectureUrl: "https://github.com/gODtECH-Ctl-Create/RepoOps/blob/MASTER/docs/architecture.md"
  problemUrl: "https://github.com/gODtECH-Ctl-Create/RepoOps/issues/new?template=problem.yml"
  upgradeUrl: "https://github.com/gODtECH-Ctl-Create/RepoOps/issues/new?template=feature.yml"
